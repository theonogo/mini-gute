# quick-guthe configuration.
#
# Everything tunable lives here rather than inline (CLAUDE.md, Conventions).
# This file is committed: secrets and personal values go in .env, and personal
# tuning (your own news feeds) in config.local.toml, which is merged over this
# one and gitignored.

[reader]
# Who the receipt is for. Personas address the reader by name and some print
# it. A placeholder: set QG_NAME in .env.
name = "Sam"

[location]
# A placeholder so the pipeline runs: QG_LATITUDE, QG_LONGITUDE and
# QG_LOCATION_NAME in .env win over these. Feeds the weather, sunrise, ISS
# passes, what's-on and every other slot that knows where you are.
name = "London"
latitude = 51.5074
longitude = -0.1278
timezone = "auto"          # "auto" resolves from the coordinates

[weather]
# Hours counted as "the day" for verdict purposes. Rain at 03:00 is not a
# reason to take a coat.
day_start = 7
day_end = 22
# A rain window needs this probability, for at least this many hours running,
# before the verdict mentions it.
rain_probability = 45
rain_min_hours = 1
# Above this UV index the verdict starts mentioning sun.
uv_notable = 5.0
# Wind in km/h that is worth a remark.
wind_notable = 30.0

[timezones]
# Slot 72. The zones themselves are TIMEZONES in .env. A friend counts as awake
# from awake_from up to, not including, awake_until, in their own local time -
# and the fine print says so, so "asleep" is a clock reading, not a claim.
awake_from = 7
awake_until = 23

[news]
count = 3
max_age_hours = 36
# Headlines longer than this are dropped rather than wrapped to three lines.
max_chars = 120
# Most grim headlines (death, war, disaster) a morning prints. Serious news is
# news; the cap is only there so the whole section is never bleak.
grim_max = 2
# How many headlines the ranker reads. Every feed gets one seat, then the rest
# are shared out by weight (D'Hondt), so a blog posting twice a day is in front
# of the ranker as surely as a wire posting a hundred times. This is the token
# dial: each candidate is a title and a summary cut to `summary_chars`.
candidates = 48
summary_chars = 120
# Days of printed headlines the ranker is shown, so it neither repeats a story
# nor misses that one has moved on (printed as a follow-up).
memory_days = 5

# Feeds for slot 10, read against data/profile.md. `name` is what prints - many
# feeds call themselves "Latest Updates" or "Blog". `weight` is how good the
# outlet is for this reader: 0.5 is filler, 1 is solid, 1.5 and up is the best
# of its kind. `max_age_hours` overrides the default for feeds that post weekly
# or less. Hacker News is read in points order, not age.
#
# A general-interest example. Put your own list in config.local.toml, where it
# replaces this one.

# --- the world, briefly
[[news.feeds]]
name = "BBC News"
url = "https://feeds.bbci.co.uk/news/world/rss.xml"
weight = 1.0
[[news.feeds]]
