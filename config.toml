[paper]
# Paper is cheap and length is not a design constraint (CLAUDE.md invariant 3).
# The budget is a guard against a runaway render - a slot in a loop, an image
# that failed to scale - not a ration. Raise it rather than trim a design.
budget_mm = 1030
# The spine prints every day and is never drawn, so the selection engine fits
# the rotating slots into budget_mm minus this reserve. Without it the engine
# fits a full draw on top of the spine and the render fails the budget.
# Measured with every persona block at its tallest pick and the legalese
# printing; the tallest spine is the Mimic wearing the Daily Roll, at ~456mm.
# Re-measure and raise it (and budget_mm with it) when a spine grows.
spine_reserve_mm = 480

[rarity]
# Per-draw tier weights. Must sum to 1. See SYSTEM.md 4. Uncommon is uncommon
# because its pool is large, not because it is scarce: any single uncommon
# still comes round rarely, so the tier can be drawn often without a repeat
# being felt.
common = 0.50
uncommon = 0.37
rare = 0.13
legendary_odds = 25        # separate per-receipt roll, 1 in N (~15 a year)
# How many rotating slots a morning draws, uniformly between the two. A pinned
# series part rides on top of this rather than taking one of them. The draw
# count and the tier weights are coupled (SYSTEM.md 4): more draws is more
# chances at a rare, so changing one moves the felt rarity of the other.
draws_min = 3
draws_max = 5

[personas]
# Per-draw tier weights for the persona, which are NOT the slot weights above -
# a persona is worn for a whole page and wears out at its own rate. Must sum
# to 1. See SYSTEM.md 3.6.
#
# A tier's weight is shared out among its members, so writing another rare
# persona makes the existing rares scarcer rather than making rare mornings
# commoner. The odds of *a* rare day are this number and stay this number.
common = 0.50
uncommon = 0.35
rare = 0.15
# The persona recency curve. Same shape as [recency], slower to recover: the
# reader sees one page a day, so the same face twice in a week reads as a broken
# machine even when the draw was honest. 0.95/14 puts a persona at 5% of its
# weight the morning after it printed, a third of it a week later, and back to
# two thirds at a fortnight. A persona that has never printed is undamped, so a
# debut does not have to queue.
suppression = 0.95
tau_days = 14

[slots]
# Per-slot tuning. This is the dial to reach for after a week of real mornings:
# how rare something *feels* is not knowable from the spec, and retuning should
# cost a config edit rather than a code change.
#
# Slots ship with the tier docs/SLOTS.md gives them. Anything listed below wins
# at run time, everywhere - selection, itemization price and the rarity stars.
# The coverage report lists retunings separately from genuine doc mismatches.
#
# `disabled` retires a slot without deleting it. It stays registered and stays
# in the coverage count; it simply never draws.
disabled = [
    115,    # three outlets, one story: did not work on real mornings
]

[slots.tier]
# <slot id> = "common" | "uncommon" | "rare"
# 132 = "uncommon"      # tarot too frequent at common
# 14  = "uncommon"      # nonogram eats 60mm; make it an event

[slots.paper_mm]
# <slot id> = <mm>. Only the budget-fitting estimate; a slot may still render
# shorter. Raise one that is being skipped unfairly, lower one that is padding.
# 14 = 70

[recency]
# weight multiplier = 1 - suppression * exp(-days_since_seen / tau)
suppression = 0.9
tau_days = 10

[paths]
data = "data"
cache = "data/cache.sqlite"
# Photographs mailed in as PHOTO replies (SYSTEM.md 6) land here and resurface
# later as printed photos. Gitignored: they are the reader's own pictures.
photos = "data/photos"
# Every recorded morning's page, as the PNG that went to the printer. The text
# of each section is kept in the store as well (`tools/printed.py` reads both
# back), so feedback on a morning can be checked against what actually printed.
archive = "out/archive"
