# Where the harvested ASCII art comes from, and what it is tagged with.
#
# Read by tools/harvestascii.py. Each key is a persona art tag (the `art_tags`
# in personas/personas.toml); its value is the asciiart.eu sub-categories that
# suit it. A sub-category listed under several tags gets all of them, which is
# how a lighthouse ends up both `nautical` and `engraving`.
#
# To give a persona more art: add its tag here, then rerun the harvest.
# `[title_tags]` adds a tag when a word appears in a piece's own title, which
# catches the moon in "misc" or the robot filed under "other".

# Piece ids that are dropped whatever their category - misfiled, or just not
# good on paper. The id is the asciiart.eu data-id kept in harvested.json.
skip = [
  "2e0bbef8cc05db9b",   # Paris skyline filed under monuments, drawn as a harbour
]

[tags]
ornament  = ["art-and-design/celtic", "art-and-design/fleur-de-lis",
             "art-and-design/scrolls", "art-and-design/geometries",
             "miscellaneous/diamonds", "miscellaneous/awards",
             "clothing-and-accessories/crowns"]
