# Slot 151 - the persona's printed object.
#
# Each persona designs one small printed thing, from scratch, in its own voice
# and style. One of its items below is drawn (no repeats until its list is used
# up); `weight` makes an item more likely (default 1).
#
# Lean into the absurd - improbable and weird, most of the time but not every
# time. The examples show the register: player stats for a dog, a formal
# invitation to a coup d'etat, a treasure map to the kraken.

[absurd]
examples = [
  "commentary-box player stats that are obviously for a dog",
  "victorian-clerk formal invitation, and the event is a coup d'etat",
  "first-mate review of an island that turned out to be a sleeping whale, three stars",
  "a museum label treating a USB stick as a sacred relic",
]
# Share of objects that go fully improbable; the rest are played nearly
# straight, with one detail wrong.
share = 0.75

[persona.victorian-clerk]
items = [
  { item = "Certificate of achievement, for something trivial, heavily sealed" },
  { item = "Notice of visit from a distinguished visitor" },
  { item = "Calling card, with the corner turned down" },
  { item = "Subscription renewal notice for something never subscribed to" },
  { item = "Invitation to a very formal event" },
]

