# Public-domain short stories for slot 148 (three-part story) and slot 144 /
# legendary format 9 (full short story). Read by tools/harveststories.py.
#
# Each book is a Project Gutenberg plain-text collection. Stories are split at
# their all-caps title headings. `internal` lists all-caps lines inside a story
# (section titles, letters, a signature) that must NOT be read as a boundary -
# splitting at one would print half a story as if it were whole.
#
# To add a book: add its id, run `python tools/harveststories.py --list <id>`
# to see where it would split, put any internal headings in `internal`, then
# run the harvest.

