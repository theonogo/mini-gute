backboard with its rim and shot clocks, or a striped
marquee with a question mark on its flag; on it the date up as the score in
white slab numerals - TOTAL 13 WKTS 10, HOME 13 - 10 AWAY, {NAME} 13 ? 10 HUSH -
the receipt number on the second line (OVERS, ATTENDANCE, PHASE, POSS, ROUND
OF WHEN),
the date along the bottom rail, the board on two legs; then a broadcast
lower-third: LIVE, and the narrated state of our man's game. The persona's name
never prints. Every section is a transcript: turns written CLIVE: / DENNIS: are
