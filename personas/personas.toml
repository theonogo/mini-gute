""", fine = "C STANDS FOR COFFEE. FRAME IT." },
  { label = "PENDING", grade = "pending", brief = "Grade pending: the inspector left before the inspection was over, or did not leave.", body = """
NOTED: The inspection began at 03:12 and has not, at the time of writing, concluded.
NOT A VIOLATION: The bell on the hatch rings when nobody rings it. Food arrives anyway.
