design = """
Built (commentary-box.css). A scorecard crossed with a broadcast caption, and a
different sport every day, rotated by date and briefed to the narrator
(variant_briefs): cricket, football, rugby, basketball (NBA), and a wildcard
game nobody understands, Calvinball by way of Night Vale. The masthead is the ground's
scoreboard: over it the pavilion roof with a batsman weathervane, floodlight
