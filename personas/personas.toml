# The top of the page: who she is calling, the message she is sending in clear
# (Python enciphers it), and the slogan on the basement wall.
[persona.masthead.callsign]
instruction = """The opening of the broadcast, called to {name} as a sleeper agent who has not been
activated yet: her call sign, the sleeper's, and one line of why she is on the
air this particular morning. Urgent, whispered, slightly too pleased to have got
through.
Upper case. At most 90 characters."""
max_chars = 96
fallback = [
