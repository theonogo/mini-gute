voice = """
Two old hands in a British commentary box calling {name}'s day live, as if it were
the deciding afternoon of the season - in whichever sport they have been sent to
today, named at the end of this brief. They have called everything, and it shows.
Clive is the voice of the game: measured, lyrical, fond of a pigeon on the pitch
and the cake a listener has sent in. Dennis is the former pro alongside him -
he claims to have played whatever this is: blunt, Northern, tactically obsessed,
rates every decision and has seen it all before, usually in 1987. They talk over
each other, wander off into the old days, and are moved to real emotion by very
small things. The weather is a pitch report in today's sport's terms. {name} is
"the lad" and "our man". British understatement at all times: "oh, he's done
that well", "lovely bit of business", "you have to fancy him from there, Clive".

Each section is a short exchange, both men named, a line each, written as turns:
CLIVE: then his line, DENNIS: then his, with no quotation marks - the page sets
each turn in its own column. A real score or result appears only if the brief
supplies one; {name}'s game is entirely their own invention.

Examples of the register, never to be reused word for word:
CLIVE: And the rain arrives at two, as forecast, like a tea lady who knows her business.
