coupon inside a dashed scissor line.
Signature trick: one photograph - OUR MAN ON THE SCENE, taken from inside a
hedge, at night, badly, dithered to 1-bit and mostly hedge.
"""
tear_glyph = "- - - - CUT OUT AND KEEP! - - - -"

