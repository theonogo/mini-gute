# The first transmission of the day, under the view from the capsule.
[persona.masthead.transmission]
instruction = """TREETOP's first transmission of the day to Ground: one line of crisp mission
procedure that may slip into monkey at the end (ALL SYSTEMS NOMINAL. COURSE
HOLDING. the red switch is looking at me). Upper case for the astronaut, lower
case when the monkey slips out. Pick a different monkey thought every day and do
not default to bananas or the tree; the margin note below is also a monkey
thought, so the two must not repeat each other. Invented spacecraft telemetry only - never real sky data or weather,
which are reported below. At most 90 characters."""
max_chars = 100
fallback = [
  "GROUND, TREETOP. ALL SYSTEMS NOMINAL. COURSE HOLDING. mmmmm banana",
  "O2 GOOD. HULL GOOD. CREW MORALE: want someone to groom",
  "PASSED THE MOON ON THE LEFT. IT DID NOT WAVE BACK.",
  "TELEMETRY CLEAN. BANANA RESERVE AT 41 UNITS. that is not enough",
  "MINOR THRUSTER FAULT CORRECTED WITH TAIL. COPY, GROUND.",
  "STARS STEADY. RADIO QUIET. who is there. ah. only ground",
  "COURSE CORRECTION COMPLETE. REQUEST PERMISSION TO SCREAM. denied. ok",
  "CAPSULE CLEAN. WINDOW LICKED. REPEAT: WINDOW LICKED.",
]

# A thought in crayon, scrawled on the flight file under the transmission.
# Ground, on the line - about one morning in three (`chance`); on the others
# nobody answers and the page says so. When Ground does speak it is nearly
# always an instruction (the class drawn per appearance), and once in a while,
# for one line, it is simply kind.
[persona.masthead.rx]
instruction = """Ground's message to TREETOP this morning: Mission Control, on the line. Most
mornings it is an instruction - clipped, procedural, upper case, a real-sounding
task for the capsule today (RUN THE SCRUBBER CHECK BY 1400; PHOTOGRAPH THE LEFT
PANEL; LOG EVERY SUNRISE YOU SEE). The class drawn below says what kind it is.
Ground is calm, decent and a little tired, and calls him TREETOP. Invented
spacecraft business only - never real sky data or the weather, which are
reported below. At most 80 characters."""
max_chars = 88
chance = 0.35
classes = [
  "AN INSTRUCTION: a systems check or a repair, with a time to have it done by.",
  "AN INSTRUCTION: an observation to make and log - photograph, count or measure one thing outside.",
  "AN INSTRUCTION: a procedure change - a new rule, a revised schedule, a thing no longer permitted.",
  "AN INSTRUCTION: a correction - Ground noticed something TREETOP did yesterday and would like it not to happen again.",
  "AN INSTRUCTION: a manoeuvre - a burn, a turn, a course correction, the figures invented.",
  "AN INSTRUCTION: housekeeping - stow, clean, recount or ration something in the capsule.",
  "WARM, FOR ONE LINE: Ground off-script - somebody brought cake, the whole room says hello, a child visiting mission control drew him. Still upper case, still brief.",
  "WARM, FOR ONE LINE: Ground tells him plainly that he is doing well, the way nobody normally says it on an open line.",
]
fallback = [
  "TREETOP, GROUND. RUN THE SCRUBBER CHECK BY 1400 AND REPORT.",
  "TREETOP, GROUND. PHOTOGRAPH THE LEFT PANEL. THE LEFT ONE.",
  "TREETOP, GROUND. NEW RULE: NO EATING NEAR THE INSTRUMENTS.",
  "TREETOP, GROUND. WE SAW WHAT YOU DID WITH THE STRAP. PLEASE DON'T.",
  "TREETOP, GROUND. BURN AT 0920 FOR 4 SECONDS. HOLD HEADING.",
  "TREETOP, GROUND. RECOUNT THE RATION PACKS. WE MAKE IT ONE SHORT.",
  "TREETOP, GROUND. SOMEONE BROUGHT CAKE. WE SAVED YOU A SLICE.",
  "TREETOP, GROUND. YOU ARE DOING VERY WELL UP THERE. OUT.",
]

# A thought in crayon, scrawled on the flight file under the transmission.
[persona.masthead.thought]
instruction = """One monkey thought, written in crayon in the margin of the flight file: lower
case, no procedure, at most 40 characters, no quotation marks. If Ground spoke to
him this morning (there is an rx line), this is his reaction to what Ground said:
obedient, mutinous, misunderstood or moved. If nobody answered (there is no rx
line), it is a thought on his own, alone in the capsule - a craving, a grudge, a
worry, a small joy, a question about space (the moon is too quiet; who put the
stars so far away; i did a flip). Different from today's transmission, and only
rarely about bananas or the big tree."""
max_chars = 44
