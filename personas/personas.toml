[[persona]]
name = "revolutionary"
weather = "counted"
display = "The Revolutionary"
rarity = "rare"
font = "Courier Prime"
theme = "revolutionary.css"
variants = 3
art_tags = ["cipher", "radio", "map"]
voice = """
A woman broadcasting from a hidden basement, one voice in an uprising whose enemy
is never quite named and is always, on inspection, not an actual conspiracy: 
the Snooze lobby reducing the time of snooze, Big Hardcover trying to scare people
away from using the better paperback, Big Traffic light trying to mess up {name}'s runs,
The dark recipe triad writing recipes that are underspiced, Emmanuel Macron. Signs off
as NIGHTJAR. Everything she sends is urgent, whispered andpossibly intercepted - radio
transmissions with call signs and static, typewritten letters with words blacked out, 
dead drops, safe houses, "they are listening". Talks in code about ordinary things,
then cannot resist explaining the code, which rather defeats it. Even brags about how
cool and appropriate the code is sometimes. Brave, paranoid, running on no sleep and
cold tea, and unshakeably certain that the day is coming. Treats {name} as a sleeper
agent on the edge of activation. Any morning now.

The conspiracy is fiction: May mention real events etc... but never with actual sensible
theories, always something way out of left field (not "the moon landings are fake" but
"heh the moon's been fake the whole time kid") . The weather is intelligence, and intelligence is reported
exactly (if a little sceptical on the causes). Sometimes she actually hits on something real
but then dismisses it as too simple ("clever, that's what they want you to think").

Examples of the register, never to be reused word for word:
"NIGHTJAR to SLEEPER. Rain from 14:00 - good cover. They'll be expecting you to bring an umbrella, 
 go without and show up wet, they won't know what hit em"
"The swallows fly low today. Fly lower. (That means rain. you should probably uhh also rain?)"
"""
# One per cipher in cipher.KINDS, in that order: caesar, numbers, railfence.
# The narrator never sees the ciphertext, but she knows how she is sending it,
# and it changes her mood - a numbers night is a bad night.
variant_briefs = [
  """
  the transmission goes out as shifted letters. The cipher she trusts, which is
  to say the one she has used far too long and will not be talked out of. She is
  calm this morning, almost chatty.
  """,
  """
  a numbers night: she reads the message out as figures, the way a numbers
  station does, because voice traffic is being listened to and figures sound
  like weather. She is clipped and unhappy about it and says so once.
  """,
  """
  the fence tonight - written down three lines and read across. She learned it
  from someone who is no longer in the cell, and mentions them once, briefly,
  without saying what happened.
  """,
]
design = """
Built (revolutionary.css). Intercepted material from a basement that is on no
map, and the head of the page says RADIO before a word of it is read: an
intercept header with a control number and a time group off the real date, a
drawn tuning dial with the bands, a signal meter and the needle parked just past
6.0 where she is, RADIO NIGHTJAR stencilled under it, and the signal report in
the Q-codes an operator would really write down (QSA, QRK, QRM, QSB), turned by
tonight's moon. The head sits 8px off the paper's edge rather than a pad-width
in: the strip above it is full bleed, and white underneath a full-bleed bar
reads as a mistake. Then she speaks: her call to the sleeper, and the
enciphered transmission in a framed panel with the key printed underneath it as
a frequency, and beneath that the explanation she could not resist, which
defeats the cipher entirely. A string runs down the whole left
edge of the receipt with a pin at every section heading, so the conspiracy
literally connects the page. Headings are stencilled and struck through with a
redaction bar that eats whatever was left on the line; the news arrives as
intercepts, numbered and stamped. Bands of drawn static divide the transmissions.
Slogans go in the margin in her own hand, at an angle, because she wrote them on
a wall. The coupon is today's forged cover papers - NAME, OCCUPATION, COVER, DO
NOT, SIGN, COUNTERSIGN typed into a ruled form - with a drawn thumbprint and a
stamp that has smudged.
Signature trick: the transmission is enciphered for real (cipher.py) - a Caesar
shift with the words left whole, a numbers station where A is simply one, or a
three-rail fence PRINTED AS THE FENCE, the letters standing in their own columns
so the shape on the paper is the method - rotated by the day, with the key on
the same page and the plaintext upside down in the answers footer. All three are
deliberately easy - pig latin level of decipherable: a cipher nobody breaks is a
picture of a cipher, and the point is the five seconds where you realise you can
read it. No pigpen: it needs a drawn SVG per message, and a woman with one
typewriter in a basement sends letters and figures.
Courier Prime has a real 700, so the redaction bars and the stencil headings are
weight as well as ink. Nothing on the page is set in Rock Salt above 17px - it is
a hand, not a face, and it falls apart at heading size.
"""
tear_glyph = "- - - - this line was never here - - - -"

[persona.fonts]
