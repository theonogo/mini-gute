name never prints: the interface does not introduce itself, it starts.
Every panel wears corner brackets - a hologram interface with the hologram
missing - and the air goes into the frames rather than between sections, because
paper costs even in the future. Headings are wide-tracked geometric caps with an
interface label opposite. The weather sits over a timeline on which today is a
tick near the start. Headlines are filed as archive/01; the totals note that
prices are in your money, which we found charming. On every receipt, an empty
dashed frame: [ COLOUR NOT SUPPORTED ].
Signature trick: the footer is a line of glyphs from later - drawn, because no
font we have contains them - with a translation underneath in your alphabet, and
the real barcode filed below that as LEGACY. The coupon carries a grid that is
very clearly not a QR code: three corner markers and a fourth that has wandered.
Major Mono Display draws figures as glyphs of its own (its zero reads as a two),
so anything with a number in it stays in the body face, and the small labels are
set in the body's 700 - the display faces are too thin to hold at 15px on paper.
"""
tear_glyph = "<< legacy tear interface >>"

[persona.fonts]
display = "Orbitron"
accent = "Major Mono Display"     # interface labels, the not-a-QR grid

