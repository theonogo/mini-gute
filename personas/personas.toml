  "NIGHTJAR TO SLEEPER. SHORT ONE TODAY. SOMETHING WAS PARKED OUTSIDE ALL NIGHT.",
  "NIGHTJAR TO SLEEPER. STILL HERE. STILL COLD. NOBODY HAS COME DOWN THE STAIRS.",
  "NIGHTJAR TO SLEEPER. IF YOU ARE READING THIS ON PAPER, BURN IT AFTERWARDS. PLEASE.",
  "NIGHTJAR TO SLEEPER. DAY ONE THOUSAND AND SOMETHING. I HAVE STOPPED COUNTING ALOUD.",
  "NIGHTJAR TO SLEEPER. THE 07:30 RAN EARLY AGAIN. I AM TAKING THAT AS A SIGNAL.",
  "NIGHTJAR TO SLEEPER. TRANSMITTING EARLY. DO NOT ASK ME WHY. ACTUALLY, DO. LATER.",
]

[persona.masthead.cipher]
instruction = """The message itself, written in clear - Python will encipher it before it prints,
so write exactly what it should say. One instruction to a sleeper agent about
something small out of an ordinary day, treated as an operation: where to be,
what to take, what not to take, what the signal is.

Range: the whole of a life lived outdoors and among other people - the metro,
the gym, the bakery, the walk, queues, the post, the bins, money, the barber,
the pool, a lift, a doorway, a park, a shop you go into too often, somebody
else's timetable. Not the kitchen: no kettles, toasters, fridges, air fryers,
spoons or biscuit tins, which is where this sort of writing goes when it is
tired.

Plain letters and spaces only, no punctuation, no digits. Upper case. At most 48
characters, because every one of them costs paper twice."""
max_chars = 52
fallback = [
  "THE SECOND BIN BEFORE NINE BRING NOTHING",
  "DO NOT ANSWER THE DOOR UNTIL THE POST HAS GONE",
  "TEA AT THE USUAL STRENGTH MEANS PROCEED",
  "WALK PAST ONCE FIRST THEN WALK PAST AGAIN",
  "THE COAT ON THE THIRD HOOK IS YOURS NOW",
  "IF THE LIGHT IS ON WE HAVE LOST THE KITCHEN",
  "LEAVE BY THE LONG WAY AND DO NOT WHISTLE",
  "COUNT TO FORTY THEN ACT ENTIRELY NORMAL",
]

[persona.masthead.slogan]
instruction = """What is painted on the basement wall behind the transmitter, in her hand, upper
case, four to seven words. Not a protest slogan - a piece of tradecraft written
where only the cell will see it, and the flavour is layers: that the thing you
uncovered was left out for you to uncover, that the cell has a cell inside it,
that whoever is at the top is a front for somebody else. Cryptic, certain,
slightly frightening, never explained, and never a demand. THE SECOND LAYER IS
ALSO A FRONT. WE WERE MEANT TO FIND THIS. NOBODY IS AT THE TOP. At most 34
characters."""
